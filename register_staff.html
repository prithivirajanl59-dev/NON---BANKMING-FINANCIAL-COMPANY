<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #023e8a;
            --primary-dark: #002855;
            --secondary-color: #4895ef;
            --accent-color: #4361ee;
            --light-gray: #f4f7f9;
            --medium-gray: #e2e8f0;
            --dark-gray: #2d3748;
            --success-color: #4bb543;
            --error-color: #e53e3e;
            --box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-gray);
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .form-header h1 {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .form-header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .back-link {
            position: absolute;
            left: 30px;
            top: 30px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-link:hover {
            transform: translateX(-3px);
            opacity: 0.8;
        }

        .back-link svg {
            margin-right: 8px;
        }

        .form-content {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 30px;
            border: 1px solid var(--medium-gray);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: var(--transition);
        }

        .form-section:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .section-header {
            background-color: var(--light-gray);
            padding: 15px 25px;
            border-bottom: 1px solid var(--medium-gray);
            display: flex;
            align-items: center;
        }

        .section-header h2 {
            color: var(--primary-color);
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .section-header svg {
            margin-right: 10px;
        }

        .section-body {
            padding: 25px;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-control {
            flex: 1 1 calc(50% - 10px);
            min-width: 250px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-gray);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: var(--transition);
            background-color: white;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(72, 149, 239, 0.15);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .document-upload-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .upload-control {
            flex: 1 1 calc(50% - 10px);
            min-width: 250px;
        }

        input[type="file"] {
            padding: 10px;
            border: 1px dashed var(--medium-gray);
            background-color: var(--light-gray);
        }

        input[type="file"]:hover {
            border-color: var(--accent-color);
            background-color: rgba(67, 97, 238, 0.05);
        }
        
        .error-message {
            background-color: rgba(229, 62, 62, 0.1);
            color: var(--error-color);
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            border-left: 4px solid var(--error-color);
            display: flex;
            align-items: center;
        }

        .error-message svg {
            margin-right: 10px;
            flex-shrink: 0;
        }

        .terms-checkbox {
            display: flex;
            align-items: center;
            margin: 30px 0;
        }

        .terms-checkbox input {
            width: auto;
            margin-right: 10px;
        }

        .terms-checkbox label {
            margin: 0;
            font-weight: 400;
        }

        .button-container {
            text-align: center;
            margin-top: 40px;
        }

        button {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(2, 62, 138, 0.2);
        }

        button:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-color));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 62, 138, 0.3);
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }
            
            .form-control, .upload-control {
                flex: 1 1 100%;
            }
            
            .back-link {
                position: relative;
                left: 0;
                top: 0;
                margin-bottom: 15px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <a href="/" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                </svg>
                Back to Home
            </a>
            <h1>Staff Registration Form</h1>
            <p>Please fill out the form below to register as a new staff member.</p>
        </div>

        <div class="form-content">
            <form action="/staff/register" method="post" enctype="multipart/form-data">
                <div class="form-section">
                    <div class="section-header">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                            </svg>
                            Personal Information
                        </h2>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <div class="form-control">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" name="name" placeholder="John Doe" required>
                            </div>
                            <div class="form-control">
                                <label for="dob">Date of Birth</label>
                                <input type="date" id="dob" name="dob" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-control">
                                <label for="gender">Gender</label>
                                <select id="gender" name="gender" required>
                                    <option value="" disabled selected>Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-control">
                                <label for="blood_group">Blood Group</label>
                                <select id="blood_group" name="blood_group" required>
                                    <option value="" disabled selected>Select Blood Group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-control">
                                <label for="aadhar">Aadhar Number</label>
                                <input type="text" id="aadhar" name="aadhar" placeholder="1234 5678 9012" 
                                       pattern="[0-9]{12}" title="Aadhar number must be 12 digits" required>
                            </div>
                            <div class="form-control">
                                <label for="pan">PAN Number</label>
                                <input type="text" id="pan" name="pan" placeholder="ABCDE1234F" 
                                       pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" title="PAN number must be 10 characters (5 letters, 4 numbers, 1 letter)" required>
                            </div>
                        </div>

                        <div class="form-control">
                            <label for="address">Full Address</label>
                            <textarea id="address" name="address" placeholder="Enter your full address" required></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                            </svg>
                            Contact Information
                        </h2>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <div class="form-control">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                            </div>
                            <div class="form-control">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" placeholder="9876543210" 
                                       pattern="[0-9]{10}" title="Phone number must be 10 digits" required>
                            </div>
                        </div>
                        <div class="form-control">
                            <label for="emergency_contact">Emergency Contact</label>
                            <input type="tel" id="emergency_contact" name="emergency_contact" placeholder="Emergency contact number" 
                                   pattern="[0-9]{10}" title="Emergency contact number must be 10 digits" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1h-3zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5zm1.886 6.914L15 7.151V12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V7.15l6.614 1.764a1.5 1.5 0 0 0 .772 0zM1.5 4h13a.5.5 0 0 1 .5.5v1.616L8.129 7.948a.5.5 0 0 1-.258 0L1 6.116V4.5a.5.5 0 0 1 .5-.5z"/>
                            </svg>
                            Employment Details
                        </h2>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <div class="form-control">
                                <label for="department">Department</label>
                                <select id="department" name="department" required>
                                    <option value="" disabled selected>Select Department</option>
                                    <option value="Operations">Operations</option>
                                    <option value="Customer Service">Customer Service</option>
                                    <option value="Loans">Loans</option>
                                    <option value="IT">IT</option>
                                    <option value="HR">HR</option>
                                    <option value="Accounts">Accounts</option>
                                </select>
                            </div>
                            <div class="form-control">
                                <label for="designation">Designation/Role</label>
                                <select id="designation" name="role" required>
                                    <option value="" disabled selected>Select Designation</option>
                                    <option value="Manager">Manager</option>
                                    <option value="Assistant Manager">Assistant Manager</option>
                                    <option value="Clerk">Clerk</option>
                                    <option value="Cashier">Cashier</option>
                                    <option value="Loan Officer">Loan Officer</option>
                                    <option value="IT Support">IT Support</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-control">
                            <label for="joining_date">Joining Date</label>
                            <input type="date" id="joining_date" name="joining_date" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <div class="section-header">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                            </svg>
                            Account Security
                        </h2>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <div class="form-control">
                                <label for="password">Create Password</label>
                                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                            </div>
                            <div class="form-control">
                                <label for="confirm_password">Confirm Password</label>
                                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h13zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13z"/>
                                <path d="M3 5.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zM3 8a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 8zm0 2.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5z"/>
                            </svg>
                            Document Upload
                        </h2>
                    </div>
                    <div class="section-body">
                        <div class="document-upload-group">
                            <div class="upload-control">
                                <label for="photo">Passport Photo</label>
                                <input type="file" id="photo" name="photo" accept="image/*" required>
                            </div>
                            <div class="upload-control">
                                <label for="aadhar_copy">Aadhar Card Copy</label>
                                <input type="file" id="aadhar_copy" name="aadhar_copy" accept=".pdf,image/*" required>
                            </div>
                            <div class="upload-control">
                                <label for="pan_copy">PAN Card Copy</label>
                                <input type="file" id="pan_copy" name="pan_copy" accept=".pdf,image/*" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms of Service and Privacy Policy.</label>
                </div>
                
                <div class="button-container">
                    <button type="submit">
                        Complete Registration
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-left: 8px;">
                            <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
