<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Loans</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; padding: 20px; }
        h1 { color: #2a6b9d; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #2a6b9d; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .back-btn { margin-top: 20px; display: inline-block; padding: 10px 15px; background: #2a6b9d; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>My Loans</h1>
    {% if loans %}
        <table>
            <tr>
                <th>Loan ID</th>
                <th>Loan Type</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Applied On</th>
            </tr>
            {% for loan in loans %}
            <tr>
                <td>{{ loan[0] }}</td>  <!-- Adjust indexes based on your DB schema -->
                <td>{{ loan[2] }}</td>
                <td>{{ loan[3] }}</td>
                <td>{{ loan[4] }}</td>
                <td>{{ loan[5] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>You have not applied for any loans yet.</p>
    {% endif %}
    <a href="/customer/dashboard" class="back-btn">Back to Dashboard</a>
</body>
</html>
