<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Trust Bank - Staff Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f5f7fa; color: #333; }
        .dashboard { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 20px 0;
        }
        .logo { text-align: center; padding: 10px 0 30px; border-bottom: 1px solid #34495e; }
        .logo h2 { font-size: 1.5rem; }
        .nav-menu { margin-top: 20px; }
        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: #34495e; }
        .nav-item i { margin-right: 10px; }

        /* Main Content */
        .main-content { flex: 1; padding: 20px; }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .search-bar { display: flex; align-items: center; }
        .search-bar input {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            width: 300px;
        }
        .user-actions { display: flex; align-items: center; gap: 15px; }
        .user-actions i { font-size: 1.2rem; cursor: pointer; }
        .user-profile { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            position: relative;
            cursor: pointer;
        }
        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3498db;
        }
        .profile-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            width: 200px;
            display: none;
            z-index: 100;
        }
        .profile-dropdown a {
            display: block;
            padding: 10px 15px;
            color: #333;
            text-decoration: none;
            transition: 0.3s;
        }
        .profile-dropdown a:hover {
            background: #f1f1f1;
        }
        .profile-dropdown a i { margin-right: 10px; }

        /* Stats Cards (Empty State) */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card h3 { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 10px; }
        .stat-card p { font-size: 1.5rem; font-weight: bold; color: #bdc3c7; }

        /* Activity Table (Empty State) */
        .activity {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .activity h2 { margin-bottom: 15px; font-size: 1.3rem; }
        .activity-placeholder {
            text-align: center;
            color: #95a5a6;
            padding: 30px 0;
        }

        /* Quick Actions */
        .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .action-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .action-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .action-card i { font-size: 2rem; margin-bottom: 10px; color: #3498db; }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h2>GLOBAL TRUST BANK</h2>
            </div>
            <div class="nav-menu">
                <div class="nav-item active">
                    <i class="fas fa-home"></i> Dashboard
                </div>
                <div class="nav-item">
                    <i class="fas fa-users"></i> Customers
                </div>
                <div class="nav-item">
                    <i class="fas fa-wallet"></i> Accounts
                </div>
                <div class="nav-item">
                    <i class="fas fa-hand-holding-usd"></i> Loans
                </div>
                <div class="nav-item">
                    <i class="fas fa-exchange-alt"></i> Transactions
                </div>
                <div class="nav-item">
                    <i class="fas fa-chart-bar"></i> Reports
                </div>
                <div class="nav-item">
                    <i class="fas fa-cog"></i> Settings
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search customer, account...">
                </div>
                <div class="user-actions">
                    <i class="fas fa-bell"></i>
                    <i class="fas fa-envelope"></i>
                    <div class="user-profile" id="userProfile">
                        <!-- Employee data loaded via JS -->
                        <img id="staffPhoto" src="" alt="Staff Photo">
                        <span id="staffName"></span>
                        <div class="profile-dropdown" id="profileDropdown">
                            <a href="#" id="viewProfileLink"><i class="fas fa-user"></i> My Profile</a>
                            <a href="#" id="viewDocumentsLink"><i class="fas fa-file-alt"></i> Documents</a>
                            <a href="#" id="logoutLink"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats Cards (Empty) -->
            <div class="stats">
                <div class="stat-card">
                    <h3>Pending Loans</h3>
                    <p>--</p>
                </div>
                <div class="stat-card">
                    <h3>New Accounts</h3>
                    <p>--</p>
                </div>
                <div class="stat-card">
                    <h3>Transactions Today</h3>
                    <p>--</p>
                </div>
                <div class="stat-card">
                    <h3>Fraud Alerts</h3>
                    <p>--</p>
                </div>
            </div>

            <!-- Recent Activity (Empty) -->
            <div class="activity">
                <h2>Recent Activity</h2>
                <div class="activity-placeholder">
                    <i class="fas fa-clock fa-2x"></i>
                    <p>No recent activity</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <div class="action-card">
                    <i class="fas fa-user-plus"></i>
                    <h3>New Customer</h3>
                </div>
                <div class="action-card">
                    <i class="fas fa-file-invoice-dollar"></i>
                    <h3>Process Loan</h3>
                </div>
                <div class="action-card">
                    <i class="fas fa-print"></i>
                    <h3>Generate Report</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch employee ID from login (simulated here)
        const employeeId = "GBSTAM001"; // Replace with dynamic ID from login
        
        // Load staff data from staff_list.html (simulated API call)
        function fetchStaffData(employeeId) {
            // In reality, you'd fetch this from your backend or localStorage
            const staffData = {
                name: "Employee Name", // Replace with actual data fetch
                photoUrl: `http://localhost:8888/tree/MyBankProject/staff_uploads/${employeeId}/profile.jpg` // Adjust path
            };
            return staffData;
        }

        // Update UI with staff data
        document.addEventListener('DOMContentLoaded', () => {
            const staffData = fetchStaffData(employeeId);
            document.getElementById("staffName").textContent = staffData.name;
            document.getElementById("staffPhoto").src = staffData.photoUrl;

            // Profile dropdown toggle
            document.getElementById("userProfile").addEventListener("click", (e) => {
                e.stopPropagation();
                document.getElementById("profileDropdown").style.display = 
                    document.getElementById("profileDropdown").style.display === "block" ? "none" : "block";
            });

            // Close dropdown when clicking outside
            document.addEventListener("click", () => {
                document.getElementById("profileDropdown").style.display = "none";
            });

            // Link actions (replace with actual paths)
            document.getElementById("viewProfileLink").addEventListener("click", () => {
                window.location.href = `staff_profile.html?id=${employeeId}`;
            });
            document.getElementById("viewDocumentsLink").addEventListener("click", () => {
                window.location.href = `staff_documents.html?id=${employeeId}`;
            });
            document.getElementById("logoutLink").addEventListener("click", () => {
                window.location.href = "logout.html";
            });
        });
    </script>
</body>
</html>
